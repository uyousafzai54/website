<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">A node in the mesh, built on seL4</title>
  <desc id="description">Drawn in the style of the seL4 whitepaper figures. A hardware root of trust bar at the bottom contains secure boot. The seL4 microkernel bar sits directly on it. Above the kernel, in user mode, are four separate protection domains: the application, OpenTelemetry logging, a remote attestation client, and a networking protocol stack with exactly two gRPC channels layered on top of it, one speaking OTLP for observability and one for internet application traffic. The application has a channel to OpenTelemetry logging, and the application, logging and attestation domains each have a channel to the networking stack, drawn as black connectors routed through the seL4 bar. Both gRPC channels leave the node over mTLS.</desc>
  <defs>
    <!-- Whitepaper palette: seL4 bar #a5cf62, hardware #9aa8bc, application/trusted #466689, native service #cae4aa, container #ffedc6 / #ffd170. -->
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="560" fill="#fff"/>
  <g font-family="Roboto, Helvetica, Arial, Liberation Sans, sans-serif" font-size="22" fill="#000">
    <rect x="60" y="420" width="980" height="110" fill="#9aa8bc"/>
    <text x="76" y="512">Hardware root of trust</text>
    <rect x="76" y="434" width="184" height="46" fill="#466689"/>
    <text x="88" y="466" fill="#fff">Secure Boot</text>

    <rect x="60" y="330" width="980" height="90" fill="#a5cf62"/>
    <text x="76" y="384" font-weight="700" font-size="26">seL4</text>

    <rect x="90" y="200" width="130" height="122" fill="#466689"/>
    <text x="102" y="268" fill="#fff">Application</text>

    <rect x="250" y="200" width="160" height="122" fill="#cae4aa"/>
    <text x="262" y="258">OpenTelemetry</text>
    <text x="262" y="286">Logging</text>

    <rect x="440" y="200" width="180" height="122" fill="#cae4aa"/>
    <text x="452" y="244">Remote</text>
    <text x="452" y="272">Attestation</text>
    <text x="452" y="300">Client</text>

    <rect x="650" y="30" width="200" height="292" fill="#ffedc6"/>
    <rect x="666" y="46" width="168" height="100" fill="#ffd170"/>
    <text x="678" y="76">gRPC Channel</text>
    <text x="678" y="104">OTLP</text>
    <text x="678" y="132">Observability</text>
    <rect x="666" y="158" width="168" height="100" fill="#ffd170"/>
    <text x="678" y="188">gRPC Channel</text>
    <text x="678" y="216">Internet App</text>
    <text x="678" y="244">Traffic</text>
    <text x="666" y="284">NW Protocol</text>
    <text x="666" y="312">Stack</text>

    <!-- Channels, routed through the kernel bar as in whitepaper Figure 2.3. Deeper runs enter the NW stack further right so none cross. -->
    <path d="M 200 324 V 352 H 280 V 324" fill="none" stroke="#000" stroke-width="5" marker-start="url(#head)" marker-end="url(#head)"/>
    <path d="M 530 324 V 352 H 770 V 324" fill="none" stroke="#000" stroke-width="5" marker-start="url(#head)" marker-end="url(#head)"/>
    <path d="M 330 324 V 374 H 800 V 324" fill="none" stroke="#000" stroke-width="5" marker-start="url(#head)" marker-end="url(#head)"/>
    <path d="M 150 324 V 396 H 830 V 324" fill="none" stroke="#000" stroke-width="5" marker-start="url(#head)" marker-end="url(#head)"/>

    <path d="M 836 96 H 890" fill="none" stroke="#000" stroke-width="5" marker-start="url(#head)" marker-end="url(#head)"/>
    <text x="902" y="104">OTLP over mTLS</text>
    <path d="M 836 208 H 890" fill="none" stroke="#000" stroke-width="5" marker-start="url(#head)" marker-end="url(#head)"/>
    <text x="902" y="216">gRPC over mTLS</text>
  </g>
</svg>
