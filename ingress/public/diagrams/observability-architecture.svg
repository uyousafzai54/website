<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-labelledby="title description">
  <title id="title">OpenTelemetry collection and querying</title>
  <desc id="description">A gRPC service in a Kubernetes service mesh contains an OpenTelemetry SDK. The SDK exports logs, metrics and traces over mutual TLS (mTLS) to an OpenTelemetry Collector running in Kubernetes. The collector forwards telemetry over an encrypted connection to the Apple Services Engineering observability backend. Prometheus stores metrics; log storage and trace storage are shown separately. A query frontend exchanges queries and results with the backend. Arrows show logical data flow, not a specific ingestion protocol. The grouping boxes do not imply security isolation or separate Kubernetes clusters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 12 5 L 0 10 Z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1100" height="860" fill="#fff"/>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" fill="#1d1d1f" font-weight="400" text-anchor="middle">
    <text x="550" y="56" font-size="28">OpenTelemetry collection and querying</text>

    <!-- Instrumentation is embedded in the service, not a separate agent. -->
    <rect x="48" y="104" width="356" height="296" rx="13" fill="#d6d7d7"/>
    <rect x="72" y="128" width="308" height="208" rx="13" fill="#d4e9d2"/>
    <text x="226" y="173" font-size="25">gRPC service</text>
    <rect x="96" y="206" width="260" height="102" rx="13" fill="#b7e3f7" stroke="#fff" stroke-width="2.5"/>
    <text x="226" y="248" font-size="23">OpenTelemetry</text>
    <text x="226" y="278" font-size="23">SDK</text>
    <text x="226" y="377" font-size="23">Service mesh (Kubernetes)</text>

    <rect x="696" y="104" width="356" height="296" rx="13" fill="#d6d7d7"/>
    <rect x="720" y="184" width="308" height="152" rx="13" fill="#b7e3f7" stroke="#fff" stroke-width="2.5"/>
    <text x="874" y="250" font-size="25">OpenTelemetry</text>
    <text x="874" y="282" font-size="25">Collector</text>
    <text x="874" y="377" font-size="25">Kubernetes</text>

    <path d="M 360 260 H 714" fill="none" stroke="#000" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="428" y="190" width="244" height="52" rx="10" fill="#000"/>
    <text x="550" y="223" font-size="23" fill="#fff">mutual TLS (mTLS)</text>
    <text x="550" y="299" font-size="20">Logs, metrics and traces</text>

    <!-- Encryption is known on this hop; its authentication mode is unspecified. -->
    <path d="M 874 403 V 530" fill="none" stroke="#000" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="846" y="457" font-size="21" text-anchor="end">Encrypted</text>
    <text x="846" y="485" font-size="21" text-anchor="end">telemetry</text>

    <rect x="496" y="536" width="556" height="284" rx="13" fill="#d6d7d7"/>
    <text x="774" y="579" font-size="24">Apple Services Engineering (ASE)</text>
    <rect x="520" y="607" width="242" height="136" rx="13" fill="#d4e9d2" stroke="#fff" stroke-width="2.5"/>
    <text x="641" y="662" font-size="25">Prometheus</text>
    <text x="641" y="697" font-size="21">Metrics</text>
    <rect x="786" y="607" width="242" height="60" rx="13" fill="#d4e9d2" stroke="#fff" stroke-width="2.5"/>
    <text x="907" y="646" font-size="25">Log storage</text>
    <rect x="786" y="683" width="242" height="60" rx="13" fill="#d4e9d2" stroke="#fff" stroke-width="2.5"/>
    <text x="907" y="722" font-size="25">Trace storage</text>
    <text x="774" y="794" font-size="25">Observability backend</text>

    <rect x="48" y="607" width="254" height="136" rx="13" fill="#f7d2f9"/>
    <text x="175" y="668" font-size="25">Query</text>
    <text x="175" y="700" font-size="25">frontend</text>
    <path d="M 307 651 H 490" fill="none" stroke="#000" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="398" y="631" font-size="20">Queries</text>
    <path d="M 490 699 H 307" fill="none" stroke="#000" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="398" y="733" font-size="20">Results</text>
  </g>
</svg>
